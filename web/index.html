<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MomOS: daily planner, trackers and calm for mum.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MomOS">
  <meta name="theme-color" content="#E0698A">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MomOS</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the big downloads immediately, in parallel, instead of one after another -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://kpvyarzywvoasgsvgcqh.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function () {
      var ua = navigator.userAgent;
      var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var chromium = !ios && !!window.chrome && /Chrome|Chromium|Edg/.test(ua);
      var l = document.createElement('link');
      l.rel = 'preload';
      l.as = 'fetch';
      l.crossOrigin = 'anonymous';
      l.href = chromium ? 'canvaskit/chromium/canvaskit.wasm' : 'canvaskit/canvaskit.wasm';
      document.head.appendChild(l);
    })();
  </script>
</head>
<body style="margin:0;background:#FFF8F6;">
  <style>
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#FFF8F6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;z-index:9999;transition:opacity .4s}
    #splash .logo{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 30px rgba(124,107,214,.35);
      animation:pulse 1.4s ease-in-out infinite}
    #splash h1{margin:18px 0 4px;font-size:26px;color:#2D2640;font-weight:900}
    #splash p{margin:0;color:#8A8399;font-size:15px}
    #splash .bar{margin-top:22px;width:140px;height:6px;border-radius:6px;background:#F3DCE3;overflow:hidden}
    #splash .bar i{display:block;width:40%;height:100%;border-radius:6px;background:#E0698A;animation:slide 1.1s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.06)}}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  </style>
  <div id="splash">
    <img class="logo" src="icons/Icon-192.png" alt="MomOS">
    <h1>MomOS</h1>
    <p>Getting your day ready…</p>
    <div class="bar"><i></i></div>
  </div>
  <div id="diag" style="display:none;position:fixed;left:16px;right:16px;bottom:24px;z-index:10000;background:#fff;border:1px solid #F3DCE3;border-radius:16px;padding:14px;font:13px -apple-system,sans-serif;color:#2D2640;word-break:break-word;max-height:45vh;overflow:auto"></div>
  <script>
    // Service worker for push notifications. Remove any old Flutter worker.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) {
          var w = r.active || r.waiting || r.installing;
          if (w && w.scriptURL.indexOf('push-sw.js') === -1) r.unregister();
        });
      }).finally(function () {
        navigator.serviceWorker.register('push-sw.js').catch(function () {});
      });
    }
    // Messages from the service worker are queued until the app is ready to read them
    window.momosInbox = [];
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && (e.data.type === 'momos-push' || e.data.type === 'momos-open')) {
          window.momosInbox.push(JSON.stringify(e.data));
        }
      });
    }
    window.momosTakeInbox = function () { var m = window.momosInbox; window.momosInbox = []; return JSON.stringify(m); };
    window.momosVibrate = function (ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
    function momosB64ToBytes(b64) {
      var pad = '='.repeat((4 - b64.length % 4) % 4);
      var raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
      var out = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
      return out;
    }
    // Returns: 'unsupported' | 'needs-install' | 'default' | 'granted' | 'denied'
    window.momosPushStatus = function () {
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
        return ios && !standalone ? 'needs-install' : 'unsupported';
      }
      return Notification.permission;
    };
    // Asks permission, subscribes, and returns the subscription as JSON text (or an error code).
    window.momosEnablePush = async function (vapidKey) {
      try {
        if (window.momosPushStatus() === 'needs-install') return 'error:needs-install';
        if (window.momosPushStatus() === 'unsupported') return 'error:unsupported';
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') return 'error:denied';
        var reg = await navigator.serviceWorker.register('push-sw.js');
        await navigator.serviceWorker.ready;
        var sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: momosB64ToBytes(vapidKey) });
        return JSON.stringify(sub.toJSON());
      } catch (e) {
        return 'error:' + (e && e.message ? e.message : 'failed');
      }
    };
    var momosErrors = [];
    function momosShowDiag(title) {
      var d = document.getElementById('diag');
      if (!d || !document.getElementById('splash')) return;
      d.style.display = 'block';
      d.innerHTML = '<b>' + title + '</b><br><span style="color:#8A8399">' +
        navigator.userAgent + '</span><br><br>' +
        (momosErrors.length ? momosErrors.map(function (e) { return '• ' + e; }).join('<br>') : 'No errors reported yet.') +
        '<br><br><button onclick="location.reload()" style="background:#E0698A;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:800">Reload</button>';
    }
    window.addEventListener('error', function (e) {
      momosErrors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      momosShowDiag('Something went wrong while loading');
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      momosErrors.push('Promise: ' + (e.reason && (e.reason.message || e.reason)));
      momosShowDiag('Something went wrong while loading');
    });
    setTimeout(function () { momosShowDiag('Still loading after 25 seconds'); }, 25000);
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); var d = document.getElementById('diag'); if (d) d.remove(); }, 450); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
